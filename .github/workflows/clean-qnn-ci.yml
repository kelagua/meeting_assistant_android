name: Clean QNN LiteRT Android

on:
  workflow_dispatch:
  push:
    paths:
      - "sherpa-qnn-meeting-assistant/**"
      - ".github/workflows/clean-qnn-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sherpa-qnn-meeting-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clean-qnn-litert-debug-apk
          path: sherpa-qnn-meeting-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
